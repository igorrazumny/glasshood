:root{--navy:#000055;--sub:#555555;--orange:#e75a1e;--text:#1a1a2e;--border:#e0e2e8;--muted:#f0f1f4}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Lato",sans-serif;color:var(--text);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);border-bottom:1px solid rgba(0,0,0,.05)}
.nav-inner{max-width:1120px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center}
.logo{flex-shrink:0;display:block}
.logo img{display:block;height:40px;width:auto}
.links{margin-left:auto;display:flex;align-items:center;gap:28px}
.links a{font-size:15px;font-weight:400;color:var(--sub);text-decoration:none;transition:color .15s}
.links a:hover{color:var(--navy)}
main{max-width:1120px;margin:0 auto;padding:80px 24px 56px}
h1{margin:0;max-width:820px;font-size:34px;line-height:1.2;font-weight:700;color:var(--navy)}
.lead{margin:20px 0 0;max-width:760px;font-size:19px;line-height:1.55;color:var(--sub)}
.bar{margin-top:32px;max-width:520px;height:6px;border-radius:999px;background:var(--muted);overflow:hidden;position:relative}
.bar span{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:var(--orange);transition:width .9s linear}
.bar.indeterminate span{width:30%;animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{left:-30%}100%{left:100%}}
.status{margin:12px 0 0;min-height:1.5em;font-size:15px;color:var(--sub)}
.actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:16px}
.btn{display:inline-block;padding:12px 20px;border-radius:12px;border:1px solid rgba(0,0,0,.1);background:#fff;font:inherit;font-size:19px;color:var(--sub);text-decoration:none;cursor:pointer;transition:all .15s}
.btn:hover,.btn:focus-visible{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
[hidden]{display:none!important}
/* Focus moves to the failure heading for screen readers; no ring for that programmatic focus. */
[tabindex="-1"]:focus{outline:none}
@media (max-width:639px){
  .nav-inner{height:auto;padding:12px 24px;flex-wrap:wrap;row-gap:12px}
  .links{margin-left:0;width:100%;gap:24px}
  main{padding-top:48px}
  h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){
  .bar span{transition:none}
  .bar.indeterminate span{animation:none;width:100%;opacity:.35}
}
</style>

<main>
  <section id="waking">
    <h1 data-text="wakingTitle"></h1>
    <p class="lead"><span data-text="wakingLead"></span> <span id="expected"></span></p>
    <div class="bar indeterminate" id="bar" role="progressbar" aria-labelledby="status" aria-valuemin="0" aria-valuemax="100"><span></span></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>
  <section id="failed" hidden>
    <h1 data-text="failedTitle" tabindex="-1" id="failed-title"></h1>
    <p class="lead" data-text="failedLead"></p>
    <div class="actions">
      <button class="btn" type="button" id="retry" data-text="retry"></button>
      <a class="btn" href="https://glasshood.ai/contact/" data-text="help"></a>
    </div>
  </section>
</main>
<script>
(function () {
  "use strict";

  // WORDING: placeholders until Igor writes the final text (REQ-GHA-018 clause 6).
  // Every visible string is here; {wait} and {elapsed} are filled in by the page.
  var TEXT = {
    title: "GlassHood is starting",
    wakingTitle: "GlassHood is starting up",
    wakingLead: "GlassHood runs on demand. Opening it starts it, and you will be taken in automatically when it is ready.",
    expected: "This usually takes {wait}.",
    starting: "Starting… {elapsed}",
    waking: "Starting… {elapsed}",
    goingToSleep: "GlassHood is just going to sleep. It will start again right after that. {elapsed}",
    ready: "Ready. Taking you in…",
    failedTitle: "GlassHood did not start",
    failedLead: "Starting is taking longer than it should. Please try again, or ask us for help.",
    retry: "Try again",
    help: "Ask for help"
  };

  // The wake controller's base address, without a trailing slash.
  var CONTROLLER = "";
  var STATUS_URL = CONTROLLER + "/status";
  var WAKE_URL = CONTROLLER + "/wake";
  var POLL_MS = 3000;
  // Clause 6: give up after 3 minutes. Tests may shorten it by setting
  // window.__WAKE_FAIL_AFTER_MS before this script runs.
  var FAIL_AFTER_MS = window.__WAKE_FAIL_AFTER_MS || 180000;
  // A return to this page within this window continues the same attempt (the 3 minutes
  // keep counting), so an app that sends the visitor back here cannot loop forever.
  var SAME_ATTEMPT_MS = 30000;
  // On "awake" the visitor is taken in, but the app may still send them back for a few
  // seconds, so entries are paced, not counted: never before this page has been open
  // for MIN_PAGE_AGE_MS (needs no storage), then 3, 6, 12, 24 s apart within an
  // attempt, until the 3-minute deadline.
  var MIN_PAGE_AGE_MS = 3000;
  var LOADED_AT = Date.now();
  var KEY = "glasshood-wake-attempt";
  var NAME_PREFIX = "glasshood-wake:";

  function el(id) { return document.getElementById(id); }
  function fill(s, vars) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] || ""; }); }
  function now() { return Date.now(); }

  // Where to go when the app is awake: ?next=, a path on this site only; "/" otherwise,
  // and never this page itself.
  function destination() {
    var next = null;
    try { next = new URLSearchParams(location.search).get("next"); } catch (e) { /* old browser */ }
    if (!next || next.charAt(0) !== "/" || next.charAt(1) === "/" || next.charAt(1) === "\\") return "/";
    try {
      var u = new URL(next, location.origin);
      if (u.origin !== location.origin || u.pathname === location.pathname) return "/";
      return u.pathname + u.search + u.hash;
    } catch (e) { return "/"; }
  }
  var NEXT = destination();

  // The attempt lives in sessionStorage, or in window.name when storage is blocked (it
  // survives navigations in the same tab), so the deadline and the pacing hold either way.
  function load() {
    try { var s = sessionStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) { /* blocked */ }
    try {
      if (window.name.indexOf(NAME_PREFIX) === 0) return JSON.parse(window.name.slice(NAME_PREFIX.length));
    } catch (e) { /* not ours */ }
    return null;
  }
  function save(a) {
    var s = JSON.stringify(a);
    try { sessionStorage.setItem(KEY, s); return; } catch (e) { /* blocked: window.name below */ }
    try { window.name = NAME_PREFIX + s; } catch (e) { /* no persistence: the page-age floor still paces */ }
  }
  function forget() {
    try { sessionStorage.removeItem(KEY); } catch (e) { /* nothing stored */ }
    try { if (window.name.indexOf(NAME_PREFIX) === 0) window.name = ""; } catch (e) { /* nothing stored */ }
  }

  var attempt = load();
  if (!attempt || now() - attempt.seen > SAME_ATTEMPT_MS) {
    attempt = { start: now(), seen: now(), entries: 0, lastEntry: 0 };
  }
  save(attempt);

  // Earliest moment this page may take the visitor in on "awake".
  function entryDue() {
    var gap = attempt.entries === 0 ? 0 : 3000 * Math.pow(2, Math.min(attempt.entries - 1, 3));
    return Math.max(LOADED_AT + MIN_PAGE_AGE_MS, (attempt.lastEntry || 0) + gap);
  }

  document.title = TEXT.title;
  Array.prototype.forEach.call(document.querySelectorAll("[data-text]"), function (node) {
    node.textContent = TEXT[node.getAttribute("data-text")];
  });

  function clock(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  function waitText(seconds) {
    if (seconds < 45) return "less than a minute";
    if (seconds < 75) return "about a minute";
    if (seconds < 105) return "about a minute and a half";
    return "about " + Math.round(seconds / 60) + " minutes";
  }

  var bar = el("bar");
  var timer = null;
  var ticker = null;
  var failed = false;
  var last = { state: null, info: null };

  function setProgress(fraction) {
    if (fraction === null) {
      bar.classList.add("indeterminate");
      bar.removeAttribute("aria-valuenow");
      bar.firstElementChild.style.width = "";
      return;
    }
    var pct = Math.round(Math.min(0.95, Math.max(0.02, fraction)) * 100);
    bar.classList.remove("indeterminate");
    bar.setAttribute("aria-valuenow", String(pct));
    bar.firstElementChild.style.width = pct + "%";
  }

  function render(state, info) {
    var elapsed = clock(now() - attempt.start);
    var expected = info && typeof info.expected_seconds === "number" && info.expected_seconds > 0 ? info.expected_seconds : null;
    el("expected").textContent = expected ? fill(TEXT.expected, { wait: waitText(expected) }) : "";
    if (state === "waking" && expected) {
      var since = info && typeof info.since === "string" ? Date.parse(info.since) : NaN;
      var from = since && since <= now() + 5000 && since > now() - 3600000 ? since : attempt.start;
      setProgress((now() - from) / (expected * 1000));
    } else if (state === "awake") {
      setProgress(1);
    } else {
      setProgress(null);
    }
    var line = state === "awake" ? TEXT.ready
      : state === "going-to-sleep" ? TEXT.goingToSleep
      : state === "waking" ? TEXT.waking
      : TEXT.starting;
    el("status").textContent = fill(line, { elapsed: elapsed });
  }

  function wake() {
    try {
      fetch(WAKE_URL, { method: "POST", cache: "no-store" }).catch(function () {});
    } catch (e) { /* the next check retries */ }
  }

  function fail() {
    failed = true;
    clearTimeout(timer);
    clearInterval(ticker);
    el("waking").hidden = true;
    el("failed").hidden = false;
    el("failed-title").focus();
  }

  function enter() {
    attempt.entries += 1;
    attempt.lastEntry = now();
    attempt.seen = now();
    save(attempt);
    location.replace(NEXT);
  }

  function poll(first) {
    if (failed) return;
    attempt.seen = now();
    save(attempt);
    if (now() - attempt.start >= FAIL_AFTER_MS) { fail(); return; }
    var ask = CONTROLLER ? fetch(STATUS_URL, { cache: "no-store" }) : Promise.reject(new Error("no controller"));
    ask
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (info) {
        if (failed) return;
        var state = info && typeof info.state === "string" ? info.state : null;
        last = { state: state, info: info };
        render(state, info);
        // A visit that runs this page starts the app, unless it is already waking or
        // awake, so a return here while the app catches up posts nothing.
        if (CONTROLLER && (state === "asleep" || (first && state !== "waking" && state !== "awake"))) wake();
        var wait = POLL_MS;
        if (state === "awake") {
          var due = entryDue();
          if (now() >= due) { enter(); return; }
          wait = Math.min(POLL_MS, Math.max(250, due - now()));
        }
        timer = setTimeout(poll, wait);
      });
  }

  el("retry").addEventListener("click", function () {
    forget();
    location.reload();
  });

  render(null, null);
  // Between checks, keep the elapsed time and the bar moving from the last status.
  ticker = setInterval(function () { if (!failed) render(last.state, last.info); }, 1000);
  poll(true);
})();
</script>
