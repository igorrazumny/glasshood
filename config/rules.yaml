# =============================================================================
# LAYER 1 RULES — Deterministic monitoring (no AI)
# =============================================================================
# Evaluated on every topology poll (~15s). GMP-classifiable under Annex 22.
# Changes to this file should be documented (who, when, why).
# REQ-GHA-027 (2026-11-06, Igor): an alarm is shown while its condition holds, once
# per group and part (the higher severity wins); title is the reader's plain line
# ({part}, {value}); name is the rule's short name in the "not checked" list.
# REQ-GHA-028: these are DEFAULTS. A system whose landscape file lists `alarms:` uses
# those instead. kind: example marks an alarm shown on the demo but not yet trusted
# (at most a warning). Response time is the median request (typical), not the mean.
# =============================================================================

rules:
  # --- Resource usage (VM nodes) ---
  - id: ram_high
    description: "High RAM usage"
    name: "Memory use"
    group: ram
    title: "{part}: memory is {value}% full"
    severity: warning
    scope: node
    node_types: [vm]
    condition:
      metric: ram_percent
      operator: ">"
      threshold: 85

  - id: ram_critical
    description: "Critical RAM usage"
    name: "Memory use"
    group: ram
    title: "{part}: memory is almost full ({value}%)"
    severity: critical
    scope: node
    node_types: [vm]
    condition:
      metric: ram_percent
      operator: ">"
      threshold: 95

  - id: cpu_high
    description: "High CPU usage"
    name: "Processor load"
    group: cpu_node
    title: "{part}: processor is busy ({value}%)"
    kind: example
    severity: warning
    scope: node
    node_types: [vm]
    condition:
      metric: cpu_percent
      operator: ">"
      threshold: 80

  - id: disk_full
    description: "Disk nearing capacity"
    name: "Disk space"
    group: disk
    title: "{part}: disk is almost full ({value}%)"
    severity: critical
    scope: node
    node_types: [vm]
    condition:
      metric: disk_percent
      operator: ">"
      threshold: 90

  # --- Load balancer ---
  - id: lb_latency_high
    description: "High load balancer latency"
    name: "Response time"
    group: lb_latency
    title: "{part}: responses are slow (typical {value} ms)"
    severity: warning
    scope: global
    condition:
      source: monitoring
      metric: lb_latency_ms
      operator: ">"
      threshold: 1000

  - id: lb_latency_critical
    description: "Critical load balancer latency"
    name: "Response time"
    group: lb_latency
    title: "{part}: responses are very slow (typical {value} ms)"
    severity: critical
    scope: global
    condition:
      source: monitoring
      metric: lb_latency_ms
      operator: ">"
      threshold: 5000

  # --- Error rates ---
  - id: error_spike
    description: "Error rate spike"
    name: "Application errors"
    group: errors
    title: "{part}: {value} application errors in the last 15 minutes"
    severity: warning
    scope: global
    condition:
      source: logging
      metric: error_count_15m
      operator: ">"
      threshold: 5

  - id: error_storm
    description: "Error storm"
    name: "Application errors"
    group: errors
    title: "{part}: many application errors ({value} in the last 15 minutes)"
    severity: critical
    scope: global
    condition:
      source: logging
      metric: error_count_15m
      operator: ">"
      threshold: 20

  # --- Node status ---
  - id: node_error
    description: "Node in error state"
    name: "Part failing its check"
    group: status
    title: "{part} is failing its check"
    severity: critical
    scope: node
    condition:
      metric: status
      operator: "=="
      value: "error"

  - id: node_stale
    description: "Node data stale"
    name: "Part without fresh data"
    group: status
    title: "{part}: no fresh data"
    severity: warning
    scope: node
    condition:
      metric: status
      operator: "=="
      value: "stale"

  # --- CVE security (Phase 2) ---
  - id: cve_critical_gxp
    description: "Critical CVE on GxP-critical system"
    name: "Critical vulnerabilities"
    group: cve_critical
    title: "{part}: critical security vulnerability found"
    severity: critical
    scope: global
    condition:
      source: security
      metric: critical_gxp_count
      operator: ">"
      threshold: 0

  - id: cve_high_count
    description: "Multiple high-severity CVEs"
    name: "Serious vulnerabilities"
    group: cve_high
    title: "{part}: {value} serious security vulnerabilities"
    severity: warning
    scope: global
    condition:
      source: security
      metric: high_count
      operator: ">"
      threshold: 3

  # --- Anomaly detection (Phase 3) ---
  # One alarm per anomaly, in the same group and part as the threshold rules on that
  # metric, at the anomaly's own severity (REQ-GHA-026, REQ-GHA-027 clause 2).
  - id: anomaly_detected
    description: "Statistical anomaly in infrastructure metrics"
    name: "Unusual readings"
    title: "{part}: {what} is unusual ({value}, normally about {normal})"
    kind: example
    severity: warning
    scope: global
    per_anomaly: true
    groups:
      error_count_15m: errors
      lb_latency_ms: lb_latency
      lb_request_count_1h: traffic
      vm_cpu_percent: cpu
    condition:
      source: anomaly
